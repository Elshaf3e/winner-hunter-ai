<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0c1c2c"/>
  <title>Winner Hunter AI — اكتشف فرص المنتجات</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<div id="appShell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brandmark">✦</span><div><strong>WINNER <b>HUNTER</b></strong><small>PRODUCT INTELLIGENCE</small></div></div>
    <div class="sidebar-label">مساحة العمل</div>
    <nav aria-label="القائمة الرئيسية">
      <button class="nav-item active" data-page="dashboard"><span>◫</span> نظرة عامة</button>
      <button class="nav-item" data-page="ads"><span>▦</span> مكتبة الإعلانات</button>
      <button class="nav-item" data-page="winners"><span>♛</span> منتجات Winner</button>
      <button class="nav-item" data-page="suppliers"><span>➤</span> الموردين</button>
      <button class="nav-item" data-page="competitors"><span>◎</span> المنافسين</button>
      <button class="nav-item" data-page="saved"><span>♡</span> المحفوظات</button>
      <div class="nav-separator"></div>
      <button class="nav-item" data-page="calculator"><span>⌗</span> حاسبة الأرباح</button>
      <button class="nav-item" data-page="settings"><span>⚙</span> الإعدادات والربط</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="local-tag"><span class="pulse"></span> Web First · بدون Python</div>

      <div class="version">WEB v0.2.0</div>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <div class="top-start"><button class="mobile-menu" id="mobileMenu" aria-label="فتح القائمة">☰</button><div class="breadcrumbs">المساحة / <span id="crumb">نظرة عامة</span></div></div>
      <div class="top-actions"><span class="offline-pill">● حفظ داخل المتصفح</span><button class="top-button" id="topImport">⇧ استيراد بيانات</button><div class="avatar">WH</div></div>
    </header>
    <main class="content" id="content" aria-live="polite"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div class="modal-overlay hidden" id="modalOverlay" role="presentation"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<script src="./app.js" defer></script>
</body>
</html>
